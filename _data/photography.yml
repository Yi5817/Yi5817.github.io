# Albums for /photography/, newest album first.
# Photos within an album run in the order they were taken (EXIF DateTimeOriginal).
#
# Images live in assets/photos/<slug>/: <file>.jpg is the full-resolution original
# (loaded when a frame is clicked) and <file>-thumb.jpg is the 1200px grid version.
# w/h are the original's pixel dimensions -- they only set the aspect ratio used
# for layout. `caption` is not displayed; it becomes the image's alt text.

